<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Aluno</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;

        background-image: url('photo.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
        margin: 0;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background: rgba(0, 0, 0, 0.35);

        z-index: 0;
    }

    .login {
        position: relative;
        z-index: 1;

        background: white;

        padding: 30px;

        width: 350px;
        max-width: 90%;

        border-radius: 10px;

        box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }

    h1 {
        text-align: center;

        font-size: 24px;

        margin-top: 0;
        margin-bottom: 25px;

        color: #222;
    }

    input {
        width: 100%;

        padding: 12px;

        margin: 8px 0;

        border: 1px solid #ccc;

        border-radius: 5px;

        font-size: 16px;

        outline: none;
    }

    input:focus {
        border-color: #950606;
    }

    button {
        width: 100%;

        padding: 12px;

        margin-top: 10px;

        border: none;

        border-radius: 5px;

        background: #950606;

        color: white;

        font-size: 16px;

        cursor: pointer;

        transition: 0.3s;
    }

    button:hover {
        background: #950606;
    }

</style>

</head> <body>
<div class="login">

    <h1>PORTAL DO ALUNO</h1>

    <form method="POST" action="/login">

        <input
            type="text"
            name="ra"
            placeholder="RA"
            required
        >

        <input
            type="password"
            name="senha"
            placeholder="Senha"
            required
        >

        <button type="submit">
            Acessar
        </button>

    </form>

</div>

</body> </html>
